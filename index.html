<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="256x256" href="/brand/icon.png" />
    <link rel="apple-touch-icon" href="/brand/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF4E0" />
    <meta
      name="description"
      content="Mano a Mano: cuida una mascota llanera, manda peluches de viaje y conoce los servicios de salud mental de Villavicencio."
    />
    <link rel="preload" as="image" href="/brand/wordmark.webp" type="image/webp" fetchpriority="high" />
    <style>
      .boot-screen{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:1.1rem;padding:1rem;background:#fff4e0;color:#17233b;font:600 14px/1.4 "Instrument Sans",system-ui,sans-serif}
      .boot-screen img{display:block;width:min(56vw,205px);height:auto}
      .boot-message{display:flex;align-items:center;gap:.55rem;color:#17233bb3}
      .boot-spinner{width:16px;height:16px;border:2px solid #d9f2ec;border-top-color:#0e8388;border-radius:50%;animation:boot-spin .8s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.boot-spinner{animation:none}}
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <title>Mano a Mano · Peluches llaneros</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-label="Cargando Mano a Mano">
        <img src="/brand/wordmark.webp" alt="Mano a Mano" width="560" height="156" fetchpriority="high" />
        <div class="boot-message"><span class="boot-spinner" aria-hidden="true"></span>Abriendo tu recorrido…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
